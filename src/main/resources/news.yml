# 회사별 가상 뉴스입니다. 각 회사에 호재 5개/악재 5개(총 50개)를 넣었습니다.
# headline은 자유롭게 수정하고, {stock}은 표시 회사명으로 자동 치환됩니다. 속보 타이틀에는 짧은 이름(첫 별칭)이 들어갑니다.
# 타이틀은 화면 폭이 좁아 너무 긴 문구는 양 끝이 잘릴 수 있습니다. 전체 문구는 뉴스판에 그대로 표시됩니다.
# stocks는 대상 회사의 저장 ID입니다. 아래 ID는 그대로 두고 문구/효과를 편집하는 것이 안전합니다.
# 뉴스 ID(콜론 앞 이름)는 영문 소문자/숫자/-/_만 됩니다. 대문자가 있으면 /stock reload가 거부됩니다.
# sectors: []와 stocks: [회사ID]를 함께 써서 다른 회사에 전용 뉴스가 발생하지 않게 합니다.
# weight: 추첨 가중치(기본 모두 1). 0이면 자동 추첨에서 제외하며 강제 실행은 가능합니다.
# rise-chance: 뉴스 중 상승 확률(0~1), multiplier: 기준 시간당 기본 변동폭의 배수.
# duration-seconds: 효과 지속 시장 초. immediate-percent는 발표 때 한 번만 적용됩니다(config.yml news.instant-scale 배).
# 즉시/누적 변동 한도와 반전 확률은 config.yml의 news.* 설정을 함께 따릅니다.
# 반전 시 상승 확률과 즉시 변동 방향이 뒤집히지만 뉴스 문구는 그대로 표시됩니다.
# 서버 휴장/종료 중에는 시장 시계가 정지합니다. 항목을 복사하여 개수 제한 없이 추가할 수 있습니다.
