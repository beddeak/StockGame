  invalid-mode: '&c생존/모험 모드에서 비행·탑승·이동 보조 효과 없이 도전하세요.'
  too-fast: '&e정상 완주 최소 시간에 도달하지 않았습니다. /stock parkour 로 다시 시작하세요.'
  timeout: '&e도전 시간이 끝났습니다. /stock parkour 로 다시 시작하세요.'
