# 종목 ID는 영문 소문자/숫자/하이픈/밑줄만 허용. 저장된 보유량은 이 ID와 연결됩니다.
# 종목 제거는 해당 종목을 아무도 보유하지 않을 때만 reload로 허용됩니다.
# base-rise-chance: 상승 확률(0~1), min/max-change-percent: config.yml 기준 시간(기본 4초)의 변동폭(%).
# 시작 가격/폐지 기준/아이콘/종목수 모두 여기에서 수정합니다.
# command-aliases의 첫 이름은 TAB 자동완성과 하단 자산 표시에 씁니다. 전체 회사명도 명령어 사용 가능.
stocks:
