  chart-refresh-ticks: 20   # 0초 갱신에서도 전광판 렌더링은 이 간격으로 제한
  title: '&6&l주식 거래소'
  scoreboard-title: '&6&l순위'
  sidebar-ranking-enabled: true # 오른쪽 사이드바에 모든 참가자의 돈 순위 표시
  sidebar-ranking-limit: 5     # 개인 정보 뒤 순위를 먼저 표시하고 남은 칸에 보유 종목 순환(총 15줄)
  money-decimals: 0            # 현금/주가/평단/손익 표시 소수 자리. 내부 전 단위 계산 유지
  percent-decimals: 0          # 등락률/수익률 표시 소수 자리
