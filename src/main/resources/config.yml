# 금액은 원 단위이며 소수 둘째 자리까지 지원합니다. 실제 계산은 정수(전)로 처리합니다.
# /stock reload는 먼저 모든 파일을 검증합니다. 실패하면 기존 시장을 그대로 유지합니다.
# 재시작/stop/reload 시 보유 현금, 평단가, 현재 주가, 뉴스 만료 시각을 저장합니다.
game:
  initial-cash: 1000000     # 신규 참가자/게임 초기화에 지급. 기존 현금은 이 설정만으로 바뀌지 않음
  auto-start: true          # 서버 시작 시 시장 개장. /stock stop 상태는 재시작에도 유지
  tick-seconds: 4           # 원하는 초 단위 숫자. 0=최소 1틱(0.05초), 소수도 가능
  max-tick-seconds: 86400   # 관리자 입력 상한. 기본 24시간, 필요하면 최대 1년까지 변경
  autosave-seconds: 20
  max-price: 1000000000000  # 기본 상한 1조 원. 최대 1경 원까지 설정 가능, 보유자별 정수 계산 한도 별도 보호
  max-shares-per-stock: 1000000
  volatility-reference-seconds: 4 # stocks.yml의 변동폭이 뜻하는 기준 시간. 갱신 간격을 바꿔도 이 시간 동안의 흔들림은 같음
  volatility-scale: 0.7          # 전체 종목 변동폭 배수. 0.7=폭발 프리셋, 0.5=강하게, 0.4=보통, 1=예전 폭
  max-step-change-percent: 8     # 한 번 갱신의 최대 등락률(%). 오르내림은 대칭(+x 뒤 -x면 제자리)
  buy-fee-percent: 0.0      # 0.5이면 0.5% 수수료. 평단가에 포함
  sell-fee-percent: 0.0
  trading-when-stopped: false
  teleport-on-first-join: true
  broadcast-trades: false  # 연타해도 전체 채팅은 도배하지 않음. 개인 거래 결과만 표시
  click-buy-quantity: 1     # 거래대 좌클릭 1회 매수 수량
  click-sell-quantity: 1    # 거래대 우클릭 1회 매도 수량
  sneak-click-buy-quantity: 10  # Shift(웅크리기)를 누른 상태로 좌클릭할 때의 매수 수량
  sneak-click-sell-quantity: 10 # Shift(웅크리기)를 누른 상태로 우클릭할 때의 매도 수량. 부족하면 일부 판매 없이 거부
persistence:
  flush-interval-ticks: 20  # 변경 표시만 모으고 최소 1초 간격으로 스냅샷. 파일 쓰기는 단일 별도 스레드
  retry-attempts: 4         # Windows의 일시적 파일 잠금 재시도. 이 횟수를 모두 실패한 뒤 휴장
  retry-delay-millis: 75
  backup-interval-seconds: 300 # 시각별 상태 백업 간격. 0=주기 백업 끔
  backup-retention: 12
  config-backup-retention: 12 # 관리자 설정 저장 전 고유 백업. 수동 편집본 보존
# 사채: 선이자를 떼고 빌려주고, 이자는 쌓이기만 하다가 만기에 원리금을 한 번에 회수합니다.
# 현금이 모자라면 주식을 강제 처분하고, 그래도 모자라면 즉시 파산 → 이자는 계속 붙고 추심원이 갚을 때까지 찾아옵니다.
# 대출 시간은 개장 중인 시장 시간입니다. 휴장/서버 종료 중에는 정지합니다. 기존 대출은 빌릴 때의 조건을 유지합니다.
loans:
  npc-name: '&6사채업자'
  collector:
    enabled: true              # 파산한 채무자에게 추심 주민 소환
    name: '&4사채 추심원'
    profession: WEAPONSMITH
    spawn-distance: 10
    speed: 1.0
    attack-range: 1.8
    damage: 4                  # 체력 2=하트 1개. 기본 2하트, 방어구 피해 감소 적용
    attack-interval-ticks: 40   # 기본 2초 간격. 20틱=1초
    grace-seconds: 30           # 파산 후 첫 출동까지 30초. 휴장 시 정지
    rest-seconds: 60            # 추심원에게 잡히면 가방의 광석·물고기를 압류당하고, 60초 뒤 다시 찾아옴
    update-ticks: 5
    max-distance: 32            # 너무 멀어지면 채무자 근처로 다시 이동
  enabled: true
  require-low-assets: false    # false면 재산과 무관하게 누구나 빌릴 수 있음
  allow-top-up: true           # 갚기 전에 한도 안에서 더 빌릴 수 있음. 선이자도 다시 떼고 원래 만기는 유지
  block-transfers-while-indebted: true # 채무가 남아 있으면 송금 출금 금지. 대출금 친구 계정 세탁 방지
  bankruptcy-threshold: 50000  # require-low-assets가 true일 때만 현금+주식 평가액 상한으로 사용
  min-principal: 10000
  max-principal: 3000000       # 1인당 미상환 원금 합계 한도 300만원
  default-principal: 300000    # /stock loan 금액 생략 시
  upfront-fee-percent: 10      # 선이자. 300만 원을 빌리면 30만 원을 떼고 270만 원 지급. 일찍 갚아도 돌려주지 않음
  term-seconds: 300            # 만기 5분. 만기에 원금+쌓인 이자를 한 번에 회수
  interest-interval-seconds: 60 # 1분마다 남은 원금의 이자가 쌓임(중간 회수 없음). 파산 뒤에도 계속 붙음
  interest-percent: 5          # 간격마다 남은 원금의 5%. 5분이면 25% + 선이자 10%
  max-interest-percent: 100    # 선이자 포함 총이자 상한(빌린 원금 대비). 파산자의 빚도 여기서 멈춤
  due-warning-seconds: 30      # 만기 30초 전에 화면 경고. 0=끔
news:
  max-instant-change-percent: 25 # 뉴스 발표 순간 한 번만 적용할 최대 변화율(±%)
  instant-scale: 2.5             # news.yml의 즉시 변동(immediate-percent) 배수. 2.5면 +7% 호재가 발표 순간 +17.5%, -5% 악재는 약 -11%
  max-total-change-percent: 45   # 뉴스 한 건의 누적 한도. 호재 최대 ×1.45(+45%), 악재 최대 ÷1.45(-31%). 0=가격 효과 끔
  broadcast-chat: false    # 기본 뉴스는 월드 중앙 뉴스판에 표시
  broadcast-title: true    # 뉴스가 뜨면 접속한 모든 플레이어 화면에 속보 타이틀
  min-interval-seconds: 35
  max-interval-seconds: 55
  reversal-chance: 0.05    # 0~1. 호재가 악재로/악재가 호재로 실제 효과만 반전(헤드라인은 그대로)
